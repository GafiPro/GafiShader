name: Build GafiShader

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Gradle 9.6.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.1"

      - name: Build
        run: gradle clean build --no-daemon --max-workers=1

      - name: Upload GafiShader artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GafiShader-${{ github.sha }}
          path: |
            build/libs/*.jar
          if-no-files-found: error
          retention-days: 3
